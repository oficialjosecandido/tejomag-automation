name: Deploy TejoMag to Azure

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tejomag-backend
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend to Azure App Service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Configure Azure Web App
        run: |
          # Set Python version
          az webapp config set --resource-group tejomag-rg --name ${{ env.AZURE_WEBAPP_NAME }} --linux-fx-version "PYTHON|3.11"
          
          # Enable Oryx build (auto-installs dependencies from requirements.txt)
          az webapp config appsettings set --resource-group tejomag-rg --name ${{ env.AZURE_WEBAPP_NAME }} --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true
          
          # Set startup command
          az webapp config set --resource-group tejomag-rg --name ${{ env.AZURE_WEBAPP_NAME }} --startup-file "gunicorn --bind=0.0.0.0:8000 --workers=2 --timeout=300 --access-logfile=- --error-logfile=- app:app"
      
      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend-deploy.zip . -x "*.pyc" "__pycache__/*" "*.db" "*.log" ".git/*" "venv/*" ".env"
      
      - name: Deploy to Azure Web App
        run: |
          # Deploy asynchronously - this returns immediately without waiting for app to start
          echo "Starting deployment..."
          az webapp deploy --resource-group tejomag-rg --name ${{ env.AZURE_WEBAPP_NAME }} --type zip --src-path backend-deploy.zip --async true
          
          echo "✅ Deployment package uploaded successfully"
          echo "⚠️  App startup may take a few minutes. Check Azure Portal for status."
          echo "📊 Monitor at: https://tejomag-backend.scm.azurewebsites.net"
  
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Azure Static Web Apps
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_HILL_04593EB03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "build"
          skip_app_build: false
          app_build_command: "npm run build"
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

